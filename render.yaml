services:
  - type: web
    name: hearing-backend-service
    runtime: docker
    dockerContext: ./backend-service
    dockerfilePath: ./backend-service/Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: APP_NAME
        value: hearing-backend-service
      - key: APP_ENV
        value: production
      - key: BACKEND_API_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hearing-postgres
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: "*"

databases:
  - name: hearing-postgres
    plan: free